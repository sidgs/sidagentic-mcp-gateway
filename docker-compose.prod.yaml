# SAMI MCP Gateway Docker Compose configuration for teams & organizations.
# Use this compose file if you want to host SAMI MCP Gateway on a remote server for multiple users within your org.
# The sami-mcp-gateway server runs in "enterprise" mode with enterprise features enabled.
services:
  db:
    image: postgres:17
    container_name: sami-mcp-gateway-db
    environment:
      POSTGRES_USER: sami-mcp-gateway
      POSTGRES_PASSWORD: sami-mcp-gateway
      POSTGRES_DB: sami-mcp-gateway
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=sami-mcp-gateway pg_isready -U sami-mcp-gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sami-mcp-gateway-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  sami-mcp-gateway:
    image: ghcr.io/sami-mcp-gateway/sami-mcp-gateway:${MCPJUNGLE_IMAGE_TAG:-latest}
    container_name: sami-mcp-gateway-server
    environment:
      DATABASE_URL: postgres://sami-mcp-gateway:sami-mcp-gateway@db:5432/sami-mcp-gateway
      SERVER_MODE: ${SERVER_MODE:-enterprise}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      MCP_SERVER_INIT_REQ_TIMEOUT_SEC: ${MCP_SERVER_INIT_REQ_TIMEOUT_SEC:-10}
    ports:
     - "${HOST_PORT:-8080}:8080"
    # volumes:
      # Uncomment the following lines ONLY if you need filesystem MCP server access
      # WARNING: This mounts the host filesystem and should only be used for personal/development use
      # Production deployments should avoid mounting host filesystem for security reasons
      # - /:/host:ro
      # 
      # Alternative: Mount specific directories for better security
      # - ${HOME}:/host/home:ro
      # - /tmp:/host/tmp:rw
    depends_on:
      db:
        condition: service_healthy
    restart: always

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: sami-mcp-gateway-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - prometheus_data:/prometheus
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    depends_on:
      - sami-mcp-gateway
    restart: unless-stopped

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 30s

      scrape_configs:
        - job_name: 'sami-mcp-gateway'
          static_configs:
            - targets: ['sami-mcp-gateway:8080']
          metrics_path: '/metrics'
          scrape_interval: 15s

volumes:
  db_data:
  prometheus_data:
