# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

# Basename for the build artifacts, used in the archive names and Docker images.
project_name: sami-mcp-gateway

before:
  hooks:
    - bash ./scripts/build-dashboard.sh
    - go test -v ./...
    - golangci-lint run
    - go mod tidy

builds:
  - id: sami-mcp-gateway
    main: ./main.go
    binary: sami-mcp-gateway
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X sami.io/mcpgateway/pkg/version.Version={{.Version}}
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    overrides:
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - GOWORK=off
      - goos: darwin
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - GOWORK=off

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

signs:
  - artifacts: checksum

changelog:
  disable: true

dockers:
  - dockerfile: Dockerfile
    image_templates:
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:{{ .Tag }}-amd64"
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:latest-amd64"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--build-arg=VERSION={{ .Version }}"
    goarch: amd64

  - dockerfile: Dockerfile
    image_templates:
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:{{ .Tag }}-arm64"
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:latest-arm64"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--build-arg=VERSION={{ .Version }}"
    goarch: arm64

  - dockerfile: Dockerfile.api
    image_templates:
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:{{ .Tag }}-api-amd64"
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:latest-api-amd64"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--build-arg=VERSION={{ .Version }}"
    goarch: amd64

  - dockerfile: Dockerfile.api
    image_templates:
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:{{ .Tag }}-api-arm64"
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:latest-api-arm64"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--build-arg=VERSION={{ .Version }}"
    goarch: arm64

  - dockerfile: stdio.Dockerfile
    image_templates:
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:{{ .Tag }}-stdio-amd64"
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:latest-stdio-amd64"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
    goarch: amd64

  - dockerfile: stdio.Dockerfile
    image_templates:
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:{{ .Tag }}-stdio-arm64"
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:latest-stdio-arm64"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
    goarch: arm64

docker_manifests:
  - name_template: "sidgs.jfrog.io/sami/sami-mcp-gateway:{{ .Tag }}"
    image_templates:
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:{{ .Tag }}-amd64"
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:{{ .Tag }}-arm64"

  - name_template: "sidgs.jfrog.io/sami/sami-mcp-gateway:latest"
    image_templates:
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:latest-amd64"
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:latest-arm64"

  - name_template: "sidgs.jfrog.io/sami/sami-mcp-gateway:{{ .Tag }}-api"
    image_templates:
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:{{ .Tag }}-api-amd64"
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:{{ .Tag }}-api-arm64"

  - name_template: "sidgs.jfrog.io/sami/sami-mcp-gateway:latest-api"
    image_templates:
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:latest-api-amd64"
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:latest-api-arm64"

  - name_template: "sidgs.jfrog.io/sami/sami-mcp-gateway:{{ .Tag }}-stdio"
    image_templates:
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:{{ .Tag }}-stdio-amd64"
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:{{ .Tag }}-stdio-arm64"

  - name_template: "sidgs.jfrog.io/sami/sami-mcp-gateway:latest-stdio"
    image_templates:
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:latest-stdio-amd64"
      - "sidgs.jfrog.io/sami/sami-mcp-gateway:latest-stdio-arm64"
